name: Native

# Compiles the Kotlin. The existing CI runs typecheck, lint, tests and the bob
# build — all of which pass whether or not the native code would build at all,
# and all of which were green while the module did not compile.
#
# Android only, because the package is Android only: there is no ios/ directory
# and no podspec, which the README states up front.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: lib

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      # The library module cannot build alone — it reads compileSdkVersion from
      # rootProject.ext — so it needs a host app around it.
      - name: Generate host app
        run: |
          npx --yes @react-native-community/cli@latest init HostApp \
            --version 0.86.2 --skip-install --skip-git-init --install-pods false

      # `npm install ../lib` runs the library's own `prepare` (bob build), which
      # needs its devDependencies present. Install them first.
      - name: Build the library
        working-directory: lib
        run: npm install --no-audit --no-fund

      - name: Link the library
        working-directory: HostApp
        run: |
          npm install
          npm install ../lib

      # pipefail is not optional here: without it the exit status is tee's, and
      # the first version of this job reported success over a Kotlin compile
      # that had FAILED.
      - name: Assemble
        working-directory: HostApp/android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace | tee /tmp/gradle.log

      # A host app that builds without including this library proves nothing.
      - name: Assert the library was actually compiled
        if: always()
        run: |
          if ! grep -qE 'Task :netsignal:compile.*Kotlin' /tmp/gradle.log; then
            echo "::error::The host app built without compiling this library."
            echo "::error::Autolinking did not pick it up, so this run verified nothing."
            echo "Gradle tasks that did run:"
            grep -oE '> Task :[^ ]+' /tmp/gradle.log | sort -u
            exit 1
          fi
          if grep -qE 'Task :netsignal:[^ ]+ FAILED' /tmp/gradle.log; then
            echo "::error::A task belonging to this library failed:"
            grep -oE '> Task :netsignal:[^ ]+ FAILED' /tmp/gradle.log | sort -u
            grep -E '^e: ' /tmp/gradle.log | head -40
            exit 1
          fi
          grep -oE '> Task :netsignal:[^ ]+' /tmp/gradle.log | sort -u

